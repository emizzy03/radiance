spring:
  # Default configuration - uses H2 for easy local development
  # To use PostgreSQL, run with: -Dspring.profiles.active=prod
  # Or set environment variable: SPRING_PROFILES_ACTIVE=prod
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:radiancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  format_sql: true

server:
  port: ${SERVER_PORT:8080}

