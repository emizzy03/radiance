<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiance Admin</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">R</span>
            <span>Radiance <strong>Admin</strong></span>
        </div>
        <div id="session" class="session hidden">
            <span id="who" class="who"></span>
            <button id="logoutBtn" class="btn btn-ghost">Sign out</button>
        </div>
    </header>

    <main class="container">
        <!-- Login -->
        <section id="loginView" class="card login-card">
            <h1>Sign in</h1>
            <p class="muted">Use an administrator account to manage products and view reports.</p>
            <div id="loginError" class="alert alert-error hidden"></div>
            <label>Username
                <input id="username" type="text" autocomplete="username" placeholder="admin" />
            </label>
            <label>Password
                <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            </label>
            <button id="loginBtn" class="btn btn-primary btn-block">Sign in</button>
        </section>

        <!-- Dashboard -->
        <section id="dashboard" class="hidden">
            <nav class="tabs">
                <button class="tab active" data-tab="products">Products</button>
                <button class="tab" data-tab="report">Daily purchases</button>
            </nav>

            <!-- Products tab -->
            <div id="tab-products" class="tabpanel">
                <div class="grid">
                    <div class="card">
                        <h2 id="formTitle">Add product</h2>
                        <div id="productMsg" class="alert hidden"></div>
                        <input type="hidden" id="productId" />
                        <label>Name <input id="p-name" type="text" /></label>
                        <label>Description <input id="p-description" type="text" /></label>
                        <label>Price <input id="p-price" type="number" step="0.01" min="0" /></label>
                        <label>Quantity <input id="p-quantity" type="number" min="0" /></label>
                        <label>Product image
                            <input id="p-image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
                        </label>
                        <input type="hidden" id="p-image" />
                        <div id="p-image-preview" class="image-preview hidden">
                            <img id="p-image-thumb" alt="Selected product image" />
                            <button type="button" id="p-image-clear" class="btn btn-ghost btn-sm">Remove image</button>
                        </div>
                        <div class="row">
                            <button id="saveProductBtn" class="btn btn-primary">Save</button>
                            <button id="resetFormBtn" class="btn btn-ghost">Clear</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head">
                            <h2>Products</h2>
                            <button id="refreshProducts" class="btn btn-ghost btn-sm">Refresh</button>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr><th>ID</th><th>Name</th><th>Price</th><th>Qty</th><th></th></tr>
                                </thead>
                                <tbody id="productRows"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Report tab -->
            <div id="tab-report" class="tabpanel hidden">
                <div class="card">
                    <h2>Record a purchase</h2>
                    <p class="muted">Simulate a checkout to populate the daily report.</p>
                    <div id="purchaseMsg" class="alert hidden"></div>
                    <div class="row">
                        <select id="buy-product"></select>
                        <input id="buy-qty" type="number" min="1" value="1" />
                        <button id="recordPurchaseBtn" class="btn btn-primary">Record</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-head">
                        <h2>Daily purchases by item</h2>
                        <button id="refreshReport" class="btn btn-ghost btn-sm">Refresh</button>
                    </div>
                    <div id="chart" class="chart"></div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Date</th><th>Product</th><th>Qty sold</th><th>Revenue</th></tr>
                            </thead>
                            <tbody id="reportRows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
