spring:
  # AdminBootstrap only seeds its well-known development admin under an explicit
  # dev/test profile, so the integration tests must activate one.
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:radiance-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000
