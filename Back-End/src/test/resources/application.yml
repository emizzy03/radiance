spring:
  datasource:
    url: jdbc:h2:mem:radiance-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000

# Deterministic admin credentials for tests that boot the full context.
ADMIN_USERNAME: admin
ADMIN_EMAIL: admin@radiance.local
ADMIN_PASSWORD: admin12345
